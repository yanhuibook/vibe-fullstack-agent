<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timing Tasks and Email Placeholders</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { width: 80%; margin: 0 auto; }
        .card { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; }
        .card h2 { margin-top: 0; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .button { display: block; width: 100%; padding: 10px; background-color: #007bff; color: white; text-align: center; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Timing Tasks</h2>
            <form>
                <div class="form-group">
                    <label for="taskName">Task Name</label>
                    <input type="text" id="taskName" name="taskName" required>
                </div>
                <div class="form-group">
                    <label for="cronExpression">Cron Expression</label>
                    <input type="text" id="cronExpression" name="cronExpression" required>
                </div>
                <div class="form-group">
                    <label for="command">Command</label>
                    <input type="text" id="command" name="command" required>
                </div>
                <button type="submit" class="button">Add Task</button>
            </form>
        </div>
        <div class="card">
            <h2>Email Placeholders</h2>
            <form>
                <div class="form-group">
                    <label for="emailPlaceholder">Email Placeholder</label>
                    <input type="text" id="emailPlaceholder" name="emailPlaceholder" required>
                </div>
                <button type="submit" class="button">Add Email Placeholder</button>
            </form>
        </div>
    </div>
</body>
</html>
