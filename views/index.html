<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Warehouse Inventory Platform</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { width: 80%; margin: 0 auto; }
        .card { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; }
        .card h2 { margin-top: 0; }
        .nav { text-align: center; margin-bottom: 20px; }
        .nav a { margin: 0 10px; }
        .button { display: block; width: 100%; padding: 10px; background-color: #007bff; color: white; text-align: center; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="#"><img src="logo.png" alt="Logo"></a>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
        <div class="card">
            <h2>Orders</h2>
            <p>Number of orders: <span id="ordersCount">0</span></p>
        </div>
        <div class="card">
            <h2>Products</h2>
            <p>Number of products: <span id="productsCount">0</span></p>
        </div>
        <div class="card">
            <h2>Categories</h2>
            <p>Number of categories: <span id="categoriesCount">0</span></p>
        </div>
        <div class="card">
            <h2>Users</h2>
            <p>Number of users: <span id="usersCount">0</span></p>
        </div>
        <button class="button">Go to Admin Panel</button>
    </div>
</body>
</html>
